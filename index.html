    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Deshace la codificación aplicada por public/404.html, restaurando
      // la URL original (ej. /portfolio/projects/techdemo) antes de que
      // React Router se monte, para que el enrutado por history API funcione
      // como si la petición hubiera llegado directamente a esa ruta.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
